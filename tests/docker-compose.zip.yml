services:
  db:
    image: ${SSTFW_DB_IMAGE:-mariadb:10.11}
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: ${SSTFW_WORDPRESS_IMAGE:-wordpress:php8.2-apache}
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: "1"
    ports:
      - "${SSTFW_WORDPRESS_PORT:-8080}:80"
    volumes:
      - wp_data:/var/www/html
      - ./tests/runtime/output:/var/www/html/wp-content/uploads/sstfw-test-output

  wpcli:
    image: ${SSTFW_WPCLI_IMAGE:-wordpress:cli-php8.2}
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WP_CLI_ALLOW_ROOT: "1"
    working_dir: /var/www/html
    volumes:
      - wp_data:/var/www/html
      - ./tests/runtime/output:/var/www/html/wp-content/uploads/sstfw-test-output
      - ./tests/wp-cli:/tests/wp-cli
      - ./tests/runtime/zip:/tests/zip

volumes:
  db_data:
  wp_data:
